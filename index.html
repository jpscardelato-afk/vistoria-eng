<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vistoria de Engenharia</title>
<meta name="description" content="Aplicativo de coleta de dados em vistoria técnica de engenharia.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d2c4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vistoria">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topo" id="topo">
  <h1>Vistoria de Engenharia<span class="sub">carregando...</span></h1>
</header>

<main id="app">
  <div class="vazio">Carregando dados locais...</div>
</main>

<div class="salvo" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/zip.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
<script>
/* ---- socorro: o aplicativo nunca pode ficar preso na tela de abertura ---- */
window.__erroInicial = null;
window.addEventListener('error', function (e) {
  if (!window.__erroInicial) window.__erroInicial = (e && e.message) || 'erro não identificado';
});
window.addEventListener('unhandledrejection', function (e) {
  if (!window.__erroInicial) window.__erroInicial = 'promessa rejeitada: ' + ((e && e.reason && e.reason.message) || e.reason || '');
});

window.__recarregarLimpo = function () {
  var fim = function () { location.reload(); };
  var passos = [];
  if (window.caches) passos.push(caches.keys().then(function (ks) {
    return Promise.all(ks.map(function (k) { return caches.delete(k); }));
  }));
  if (navigator.serviceWorker) passos.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
    return Promise.all(rs.map(function (r) { return r.unregister(); }));
  }));
  Promise.all(passos).then(fim, fim);
  setTimeout(fim, 4000);
};

window.__apagarBase = function () {
  if (!confirm('Apagar TODOS os dados do aplicativo neste dispositivo? Só faça isso se tiver o backup ou o arquivo-semente.')) return;
  try { indexedDB.deleteDatabase(window.__DBNAME || 'vistoria_eng_v1'); } catch (e) { }
  setTimeout(function () { location.reload(); }, 1000);
};

setTimeout(function () {
  if (window.PERICIA_PRONTO) return;
  var el = document.getElementById('app');
  if (!el) return;
  el.innerHTML =
    '<div class="aviso crit"><b>O aplicativo não terminou de abrir</b>' +
    (window.__erroInicial ? ('Detalhe técnico: ' + window.__erroInicial)
      : 'Nenhum erro foi reportado. Normalmente é cache desatualizado ou o armazenamento local preso.') +
    '</div>' +
    '<div class="barra-botoes"><button class="btn primario bloco" onclick="location.reload()">Tentar novamente</button></div>' +
    '<div class="barra-botoes"><button class="btn bloco" onclick="window.__recarregarLimpo()">Recarregar ignorando o cache</button></div>' +
    '<div class="barra-botoes"><button class="btn perigo bloco" onclick="window.__apagarBase()">Apagar dados locais e recomeçar</button></div>' +
    '<div class="aviso">Comece pelo botão do meio: ele troca os arquivos do aplicativo e <b>preserva</b> os dados da vistoria. ' +
    'O último apaga tudo — use apenas com o backup ou a semente em mãos.</div>';
}, 9000);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('Service worker não registrado:', e.message);
    });
  });
}
</script>
</body>
</html>
