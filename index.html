<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vistoria de Engenharia</title>
<meta name="description" content="Aplicativo de coleta de dados em vistoria técnica de engenharia.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d2c4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vistoria">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topo" id="topo">
  <h1>Vistoria de Engenharia<span class="sub">carregando...</span></h1>
</header>

<main id="app">
  <div class="vazio">Carregando dados locais...</div>
</main>

<div class="salvo" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/zip.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('Service worker não registrado:', e.message);
    });
  });
}
</script>
</body>
</html>
